io:
  sapl:
    pdp:
      embedded:
        enabled: true
        pdp-config-type: RESOURCES
        config-path: /policies
        policies-path: /policies
        print-text-report: true

server:
  port: 8080
  servlet:
    context-path: /

spring:
  main:
    banner-mode: off
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  devtools:
    restart:
      enabled: false

logging:
  level:
    "[io.sapl]": INFO
    "[org.springframework]": WARN
